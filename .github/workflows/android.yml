name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pratyahara-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/

  # End-to-end tests on an Android emulator, with a stand-in Instagram (testapps/fakeinsta).
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app, tests and stand-in Instagram
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :testapps:fakeinsta:assembleDebug

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r testapps/fakeinsta/build/outputs/apk/debug/fakeinsta-debug.apk
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch tests-failed
            adb exec-out run-as app.pratyahara.debug tar c files/screens > screens.tar || true
            test ! -f tests-failed

      - name: Unpack screenshots
        if: always()
        run: mkdir -p screens && (tar xf screens.tar -C screens || true)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: screens/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-reports
          path: app/build/reports/androidTests/

  # Pushing a tag like v0.1.0 publishes a GitHub Release with the APK attached.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pratyahara-debug-apk
          path: apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          src=$(ls apk/*.apk | head -1)
          cp "$src" Pratyahara.apk
          cp "$src" "Pratyahara-$TAG.apk"
          gh release create "$TAG" Pratyahara.apk "Pratyahara-$TAG.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pratyahara $TAG (test build)" \
            --notes "Test build for sideloading. Install Pratyahara.apk on your phone; see the README section \"Testing on a real phone\". Package app.pratyahara.debug, signed with the public test key, so it is not the Play Store build."
