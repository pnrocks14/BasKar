name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug

      # The Play build: minified, unsigned. It is signed with the private upload key outside CI.
      - name: Build Play bundle
        run: ./gradlew :app:bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pratyahara-play-bundle
          path: app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: pratyahara-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/

  # End-to-end tests on an Android emulator, with a stand-in Instagram (testapps/fakeinsta).
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app, tests and stand-in Instagram
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :testapps:fakeinsta:assembleDebug :app:assembleRelease

      # The minified Play build must at least start: sign it with the beta key just to install it here.
      - name: Sign the release APK for a smoke test
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk release-aligned.apk
          "$BT/apksigner" sign --ks app/beta.keystore --ks-pass pass:pratyahara-beta --ks-key-alias beta --out release-smoke.apk release-aligned.apk

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r testapps/fakeinsta/build/outputs/apk/debug/fakeinsta-debug.apk
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch tests-failed
            adb exec-out run-as app.pratyahara.beta tar c files/screens > screens.tar || true
            adb install -r release-smoke.apk
            adb shell am start -W -n app.pratyahara/.MainActivity
            sleep 8
            adb shell pidof app.pratyahara || { echo "Release build is not running"; adb logcat -d -s AndroidRuntime:E | tail -60; touch tests-failed; }
            adb shell uiautomator dump /sdcard/release.xml > /dev/null; adb shell cat /sdcard/release.xml | grep -q "Get started" || { echo "Release build did not show the welcome screen"; adb logcat -d -s AndroidRuntime:E | tail -60; touch tests-failed; }
            test ! -f tests-failed

      - name: Unpack screenshots
        if: always()
        run: mkdir -p screens && (tar xf screens.tar -C screens || true) && ls -R screens

      - name: Show failing tests
        if: failure()
        run: find app/build/outputs/androidTest-results -name '*.xml' -exec grep -h -A25 '<failure' {} + | head -300 || true

      # Screenshots also go to the test-screens branch so they can be viewed on GitHub without downloading.
      - name: Publish screenshots to the test-screens branch
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -d screens/files/screens ] || exit 0
          cd screens/files/screens
          git init -q -b test-screens
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Emulator screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" test-screens

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: screens/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-reports
          path: app/build/reports/androidTests/

  # Pushing a tag like v0.1.0 publishes a GitHub Release with the APK attached.
  # Every green push to main refreshes the test release for the app's current versionName.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: pratyahara-debug-apk
          path: apk

      - uses: actions/download-artifact@v4
        with:
          name: pratyahara-play-bundle
          path: aab

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          src=$(ls apk/*.apk | head -1)
          cp "$src" Pratyahara.apk
          cp "$src" "Pratyahara-$TAG.apk"
          cp aab/*.aab "Pratyahara-$TAG-play-unsigned.aab"
          notes="Test build for sideloading, from commit ${GITHUB_SHA::7}. Install Pratyahara.apk on your phone; see the README section \"Testing on a real phone\". Package app.pratyahara.beta, signed with the beta key, so it is not the Play Store build."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" Pratyahara.apk "Pratyahara-$TAG.apk" "Pratyahara-$TAG-play-unsigned.aab" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" Pratyahara.apk "Pratyahara-$TAG.apk" "Pratyahara-$TAG-play-unsigned.aab" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Pratyahara $TAG (test build)" --notes "$notes"
          fi
